That's how you could make gravity in space. Spin a ring-shaped station and the floor has to keep pushing everyone inwards to carry them round. That push feels exactly like weight. Faster spin or a bigger ring gives stronger "gravity". Nothing actually pulls you down: the floor just keeps getting in the way of the straight line you'd otherwise follow.`,Sim:Lg,maths:[{title:"Where $v^2/r$ comes from",body:"In one second, an object going round a circle at speed $v$ turns through an angle of $v/r$ radians (the arc length it covers divided by the radius). Its velocity arrow, of length $v$, turns by the same angle, and a short arrow of length $v$ turning by a small angle changes by about $v \\times$ angle (the Arrows block showed this change points at the centre). So each second the velocity changes by $v \\times v/r$: the acceleration is $v^2/r$."}],deeper:`**Spinning stations in fiction and fact.** The rotating wheel of *2001: A Space Odyssey* and the *Hermes* ship in *The Martian* are realistic designs. In 1966 the Gemini 11 crew tied their capsule to a rocket stage with a 30 m tether and set the pair slowly spinning: the first artificial gravity, about 0.00015 g.

ointing the same way as the net force.`})]}),(0,G.jsx)(Ct,{visual:we,controls:Fe}),(0,G.jsxs)(qt,{children:[(0,G.jsx)($e,{id:"f-coast",question:"Switch **every** thruster off while the probe is moving. What does it do next?",options:["Keeps going in a straight line at the same speed, forever","Gradually slows down and stops","Stops straight away","Slowly drifts off course"],answer:0,explain:"With no net force there is no acceleration, so the velocity arrow never changes: same speed, same direction, for ever. That is **Newton's first law**. On Earth something always slows things down (friction, air), which is why it took until the 1600s to notice. Out here nothing does: Voyager 1's engines have been off for decades, and it is still coasting out of the solar system at about 17 km/s.",tryIt:"set all three thrusters to 0 N and press Play.",onApply:()=>It([Yn(90),Yn(0),Yn(180)],4,!1)}),(0,G.jsx)($e,{id:"f-sideways",question:"The probe is moving right. A steady push straight **up** (at right angles to the motion) comes on. What path does it follow?",options:["A curve that bends upwards more and more, but never points straight up","It turns to face up, then goes straight up","A circle","A straight line at 45\xB0"],answer:0,explain:"The push only ever adds **upward** velocity, a little more each second; nothing changes the sideways part, so the probe keeps drifting right just as fast as before. Sideways steady, upwards growing: the path bends more and more but never quite points up. It's a **parabola**, the same shape as a ball thrown across a field, and for the same reason. Watch the velocity arrows left behind: each one is the last plus a little arrow pointing up.",tryIt:"one thruster at 1 N pointing up (90\xB0), starting speed 4 m/s.",onApply:()=>It([{n:1,deg:90},Yn(0),Yn(180)],4,!1)}),(0,G.jsx)($e,{id:"f-steer",question:"Now thruster A **steers**: it keeps turning so it always pushes at right angles to the motion. What path does the probe follow?",options:["A circle, at a steady speed","A spiral inwards","A parabola, like before","A straight line"],answer:0,explain:"A push at right angles to the motion can't speed the probe up or slow it down; it can only turn it. A steady sideways push turns it by the same amount every second, and a path that turns steadily is a **circle**. Nothing is pushing the probe *outwards*: the only force points to the centre. This is the whole secret of orbits. In Newton's cannon, gravity does the job of the steering thruster.",tryIt:"tick 'Thruster A steers', A at 8.5 N, starting speed 6 m/s.",onApply:()=>It([{n:8.5,deg:90},Yn(0),Yn(180)],6,!0)}),(0,G.jsx)(Rt,{goal:"Balance the probe: make the **net force zero** while all three thrusters push at least **3 N** each (steering off).",done:mt,hint:"Turn on 'Show the forces head to tail'. For the forces to add up to nothing, the chain of three arrows must end exactly where it started: they have to form a closed triangle.",success:"Balanced: three real pushes, zero net force, and the probe carries on exactly as if nothing were pushing it at all. The head-to-tail arrows close into a triangle. Forces that cancel are everywhere: right now the floor pushes up on you exactly as hard as gravity pulls you down."})]})]})}var r2={id:"forces",title:"Forces: arrows that change motion",hook:"Why does motion need no cause, but every change in motion does?",explain:`A **force** is a push or a pull: one thing acting on another. A thruster's exhaust pushes a probe, a rope pulls, the Earth's gravity pulls you down and the floor pushes you up. Every force has a **size**, measured in newtons (N), and a **direction**, so we draw it as an arrow on the thing it acts on.

When several forces act at once, the object responds to just one thing: their total, the **net force**. Place the arrows head to tail and the net force is the arrow from start to finish. Forces pointing opposite ways cancel.

The net force doesn't set the velocity; it sets how the velocity **changes**. Each second, the velocity arrow gains a little extra arrow pointing the same way as the net force: that's the acceleration. Push along the motion and it speeds up, push against it and it slows, push sideways and it turns. With no net force at all nothing changes: it carries on in a straight line at a steady speed, forever. That's why motion needs no cause, but a change in motion always does.`,Sim:Jg,maths:[{title:"Adding arrows by their parts",body:"Every arrow can be split into an **across** part and an **up** part (pointing left or down makes that part negative). To add arrows, add all the across parts, then all the up parts: the live line under the first formula does exactly that. The length of the result comes from Pythagoras, because the across and up parts make a right-angled triangle: $\\text{length} = \\sqrt{\\text{across}^2 + \\text{up}^2}$."},{title:"F = ma and a = F/m are the same law",body:"Newton's second law is usually written $F = ma$. Divide both sides by $m$ and you get $a = F/m$, the form used here, because it reads as cause and effect: the net force (cause) divided by the mass gives the acceleration (effect). An equation stays true whichever way round you arrange it, as long as you do the same thing to both sides."}],deeper:`**Two thousand years of the wrong idea.** For Aristotle, and most people since, a moving thing needs a push to keep moving: stop pushing a cart and it stops. But the push was really fighting friction. Galileo noticed that balls rolling on smoother and smoother ramps kept going further, and guessed that with no friction at all they would never stop. Newton made that his first law.

**One newton is about the weight of an apple.** A 100 g apple is pulled down by Earth's gravity with about 1 N. A person weighs 600 to 900 N; the five engines of the Saturn V that launched Apollo pushed with about 35 million N.

**Every push and pull comes from one of four forces.** Gravity, electromagnetism, and two nuclear forces that act only inside atoms. The floor holding you up, a rope's tension, a thruster's exhaust: all electromagnetism, atoms pushing on atoms. Gravity is the odd one out, and Einstein's general relativity says it isn't a force at all. Someone falling freely feels no force, because they are following the straightest possible path through curved space-time. That idea comes back in a big way near black holes.`,next:"Every force is one thing pushing on another, so forces always come in pairs. That turns out to be the only way to move when there is nothing to push against."};var Gt=ae(it(),1);var Sa=(e,t,r)=>e+t*r,ei=(e,t,r)=>e*r+.5*t*r*r;function n2(e,t,r,n){let a=r/n,i=0;for(let s=0;s<n;s++)i+=Sa(e,t,s*a)*a;return i}function a2(e,t,r){let n=[0,ei(e,t,r)];if(t!==0){let a=-e/t;a>0&&a<r&&n.push(ei(e,t,a))}return[Math.min(...n),Math.max(...n)]}var dn=ae(it(),1);function th(e,t,r,n){let a=(n-r)/(t-e||1),i=s=>r+(s-e)*a;return i.invert=s=>e+(s-r)/a,i}function rh(e,t,r,n){let a=Math.log10(e),i=Math.log10(t),s=(n-r)/(i-a||1),o=l=>r+(Math.log10(Math.max(l,1e-300))-a)*s;return o.invert=l=>Math.pow(10,a+(l-r)/s),o}function nh(e,t,r=6){if(!(t>e))return[e];let n=(t-e)/Math.max(1,r),a=Math.pow(10,Math.floor(Math.log10(n))),i=n/a,s=(i>=5?10:i>=2?5:i>=1?2:1)*a,o=Math.ceil(e/s-1e-9)*s,l=[];for(let h=o;h<=t+s*1e-9;h+=s)l.push(Math.abs(h)<s*1e-9?0:Number(h.toPrecision(12)));return l}function i2(e,t){let r=[],n=[],a=Math.floor(Math.log10(e)),i=Math.ceil(Math.log10(t));for(let s=a;s<=i;s++){let o=Math.pow(10,s);o>=e*(1-1e-9)&&o<=t*(1+1e-9)&&r.push(o);for(let l=2;l<=9;l++){let h=l*o;h>e&&h<t&&n.push(h)}}if(r.length<3){for(let s of n){let o=Math.round(s/Math.pow(10,Math.floor(Math.log10(s))));(o===2||o===5)&&r.push(s)}r.sort((s,o)=>s-o)}return{major:r,minor:n}}function ah(e){if(e===0)return"0";let t=Math.abs(e);if(t>=1e4||t<.001){let r=Math.floor(Math.log10(t)),n=e/Math.pow(10,r);return`${Mat Going down a layer is always the same move: take the **rate of change**, which on a graph is how steep it is (its *slope*). Going back up is always the reverse: **add up thin slices**, which on a graph is the area underneath. So yes: if you know the velocity at every instant, and where you started, you can say exactly where you'll be. With steady acceleration, the adding-up gives the two formulas below; every orbit later on is the same two ideas, repeated in tiny steps.`,Sim:r7,maths:[{title:"Slope: how steep a graph is",body:`The slope of a straight line is how much it rises for every step to the right: $\\text{slope} = \\dfrac{\\text{rise}}{\\text{run}}$. On a position\u2013time graph the rise is in metres and the run is in seconds, so the slope is in metres per second: a velocity.

kg)"],["\\qv{v_0}","their shared velocity before the throw: drifting away at 0.05 m/s"],["\\qv{v_a},\\ \\qv{v_o}","her velocity and the object\u2019s, after the throw (away from the station is positive)"]],live:`(\\qm{${_(s+M-T.dm,0)}} + \\qm{${_(T.dm,1)}})(\\qv{${_(ni,2)}}) = \\qm{${_(s+M-T.dm,0)}}(\\qv{${_(Le,3)}}) + \\qm{${_(T.dm,1)}}(\\qv{${_(K,2)}})`,liveNote:l>1?`That's the first of ${l} pieces. Each later throw uses the same rule with whatever mass is left.`:"Both sides come to the same number: check it."})]}),(0,ie.jsx)(Ct,{visual:ce,controls:Te}),(0,ie.jsxs)(qt,{children:[(0,ie.jsx)($e,{id:"sa-direction",question:"She is drifting **away** from the station. To get back, which way should she throw the wrench?",options:["Away from the station","Towards the station","Straight up","It doesn't matter: she can't change her motion"],answer:0,explain:"The wrench and the astronaut push each other apart, so she moves the **opposite** way to the wrench. Throw it away from the station and she recoils towards it. Throwing *towards* the station feels natural, and sends her further away.",tryIt:"throw the wrench away from the station at 6 m/s.",onApply:()=>{t("wrench"),i(1),n(6),h(1),y(0),f(!0)}}),(0,ie.jsx)($e,{id:"sa-heavy",question:"She throws her 20 kg oxygen tank instead of the 2 kg wrench, just as fast. How much faster does she head back?",options:["About ten times faster","About twice as fast","The same speed","Slower: the tank is harder to throw"],answer:0,fixedOrder:!0,explain:"Ten times the mass at the same speed carries ten times the momentum, and she gets the same amount the other way. (A little less than ten times, since she also loses the tank's mass.) Not a great trade, though: she needs that oxygen.",tryIt:"pick the oxygen tank.",onApply:()=>{t("tank"),i(1),n(6),h(1),y(0),f(!0)}}),(0,ie.jsx)($e,{id:"sa-push",question:"During the throw, which gets pushed **harder**: the wrench or the astronaut?",options:["Exactly the same, in opposite directions","The wrench Unless she throws something. Every push comes as a pair: as she pushes the wrench one way, the wrench pushes her the other way just as hard (**Newton's third law**). Both pushes last the same instant, so the wrench and the astronaut get equal and opposite amounts of **momentum**, mass times velocity, and the total never changes. The light wrench flies off fast; the heavy astronaut drifts back slowly.

A rocket does exactly this, all the time: it throws gas out of the back at a few kilometres per second.`,Sim:p7,maths:[{title:"Why equal pushes give equal momentum",body:"Newton's second law says $F = ma$, and acceleration is change in velocity per time, $a = \\Delta v / \\Delta t$. Put them together and multiply both sides by $\\Delta t$: $F\\,\\Delta t = m\\,\\Delta v$. The push times how long it lasts equals the change in momentum. The wrench and the astronaut feel the same push for the same instant, so their momentum changes are the same size, in opposite directions."}],deeper:`**Rockets.** Rocket exhaust leaves at 2 to 4.5 km/s. The speed a rocket can reach depends on that exhaust speed and on how much of the rocket is fuel: every extra km/s needs the fuel fraction to grow a lot (the **rocket equation**, Tsiolkovsky, 1903). Reaching orbit takes about 9 to 10 km/s including losses, so a launch rocket is around 85 to 90 % propellant by mass. Try the "pieces" slider: throwing the same mass in many small pieces gets her slightly more speed, because each later piece pushes a lighter astronaut. That's the rocket equation in miniature.

**You push the Earth when you walk.** Your foot pushes the ground back; the ground pushes you forward. The Earth moves too, by a vanishingly small amount, because its mass is $10^{23}$ times yours.

Isaac Newton answered with a thought experiment. Put a cannon on a mountain so tall it pokes out of the air, and fire sideways. The ball curves down and lands. Fire faster and it lands further away, because the ground curves away beneath it. Fire fast enough and the ground curves away exactly as fast as the ball falls, so it never lands: that's an **orbit**. The Moon *is* falling, all the time. Its sideways speed is what keeps it missing.`,Sim:M7,maths:[{title:"Cancelling things out of an equation",body:"An equation is a balance: do the same thing to both sides and it stays true. In $\\dfrac{GMm}{r^2} = \\dfrac{mv^2}{r}$ both sides are multiplied by the ball's mass $m$, so dividing both sides by $m$ removes it. Multiply both sides by $r$ to get $\\dfrac{GM}{r} = v^2$, then take the square root of both sides: $v = \\sqrt{GM/r}$."},{title:"Numbers like 6.67 \xD7 10\u207B\xB9\xB9",body:"$10^{24}$ is 1 followed by 24 zeros; $10^{-11}$ is 1 divided by $10^{11}$, a decimal point followed by 10 zeros and then a 1. So $5.97 \\times 10^{24}$ kg (Earth's mass) is 597 followed by 22 zeros. To multiply such numbers, multiply the front parts and **add** the powers: $10^{-11} \\times 10^{24} = 10^{13}$."}],deeper:`**Newton's Moon test.** The Moon is about 60 Earth radii away. If gravity weakens as $1/r^2$, its pull out there should be $60^2 = 3600$ times weaker than at the surface: $9.8 / 3600 \\approx 0.0027$ m/s\xB2. The Moon's actual orbit (384 000 km, once every 27.3 days) needs an inward acceleration of $v^2/r \\approx 0.0027$ m/s\xB2. They match. Each second the Moon falls about 1.4 mm towards us while travelling 1 km sideways, so it keeps missing. That was the moment gravity became *universal*: one law for apples and moons.

**Thrown balls trace ellipses, not parabolas.** The parabola you learn for a thrown ball assumes flat ground and gravity pointing straight down everywhere. Zoom out and the true path is part of an ellipse with the planet's centre at one focus: the same curves the cannon draws here.

It is always a pair. The Earth pulls the Moon, and the Moon pulls the Earth back exactly as hard, in the opposite direction (Newton's third law again). So why does the Moon do all the moving? Because the same force on a body 81 times heavier gives it 81 times less acceleration. When you jump, the Earth really does move, by an amount far too small ever to measure.`,Sim:A7,maths:[{title:"Why the square of the distance",body:"Imagine gravity spreading out from a body in all directions, like light from a bulb. At distance $r$ it is shared over the surface of a sphere, of area $4\\pi r^2$. Twice as far, that area is four times bigger, so each square metre gets a quarter as much. That's an *inverse-square law*, and light, sound and electric forces all spread out the same way."}],deeper:`**Weighing the Earth.** Newton knew the law but not the number $G$. In 1798 Henry Cavendish measured the tiny pull between lead balls in a shed, using a twisting wire. With $G$ known, the Earth's mass followed from the strength of gravity at its surface: he had "weighed the world". $G$ is still the least precisely known of the fundamental constants.

**Who orbits whom?** Since the Earth is pulled too, the Earth and the Moon both circle their shared balance point (the centre of mass), about 4 700 km from the Earth's centre: still inside the Earth. The Medium level's "Dancing partners" makes this visible.
