Gradually slows down and stops","Stops straight away","Slowly drifts off course"],answer:0,explain:"With no net force there is no acceleration, so the velocity arrow never changes: same speed, same direction, for ever. That is **Newton's first law**. On Earth something always slows things down (friction, air), which is why it took until the 1600s to notice. Out here nothing does: Voyager 1's engines have been off for decades, and it is still coasting out of the solar system at about 17 km/s.",tryIt:"set all three thrusters to 0 N and press Play.",onApply:()=>vr([hn(90),hn(0),hn(180)],4,!1)}),(0,q.jsx)(fr,{id:"f-sideways",question:"The probe is moving right. A steady push straight **up** (at right angles to the motion) comes on. What path does it follow?",options:["A curve that bends upwards more and more, but never points straight up","It turns to face up, then goes straight up","A circle","A straight line at 45\xB0"],answer:0,explain:"The push only ever adds **upward** velocity, a little more each second; nothing changes the sideways part, so the probe keeps drifting right just as fast as before. Sideways steady, upwards growing: the path bends more and more but never quite points up. It's a **parabola**, the same shape as a ball thrown across a field, and for the same reason. Watch the velocity arrows left behind: each one is the last plus a little arrow pointing up.",tryIt:"one thruster at 1 N pointing up (90\xB0), starting speed 4 m/s.",onApply:()=>vr([{n:1,deg:90},hn(0),hn(180)],4,!1)}),(0,q.jsx)(fr,{id:"f-steer",question:"Now thruster A **steers**: it keeps turning so it always pushes at right angles to the motion. What path does the probe follow?",options:["A circle, at a steady speed","A spiral inwards","A parabola, like before","A straight line"],answer:0,explain:"A push at right angles to the motion can't speed the probe up or slow it down; it can only turn it. A steady sideways push turns it by the same amount every second, and a path that turns steadily When several forces act at once, the object responds to just one thing: their total, the **net force**. Place the arrows head to tail and the net force is the arrow from start to finish. Forces pointing opposite ways cancel.

The net force doesn't set the velocity; it sets how the velocity **changes**. Each second, the velocity arrow gains a little extra arrow pointing the same way as the net force: that's the acceleration. Push along the motion and it speeds up, push against it and it slows, push sideways and it turns. With no net force at all nothing changes: it carries on in a straight line at a steady speed, forever. That's why motion needs no cause, but a change in motion always does.`,Sim:p7,maths:[{title:"Adding arrows by their parts",body:"Every arrow can be split into an **across** part and an **up** part (pointing left or down makes that part negative). To add arrows, add all the across parts, then all the up parts: the live line under the first formula does exactly that. The length of the result comes from Pythagoras, because the across and up parts make a right-angled triangle: $\\text{length} = \\sqrt{\\text{across}^2 + \\text{up}^2}$."},{title:"F = ma and a = F/m are the same law",body:"Newton's second law is usually written $F = ma$. Divide both sides by $m$ and you get $a = F/m$, the form used here, because it reads as cause and effect: the net force (cause) divided by the mass gives the acceleration (effect). An equation stays true whichever way round you arrange it, as long as you do the same thing to both sides."}],deeper:`**Two thousand years of the wrong idea.** For Aristotle, and most people since, a moving thing needs a push to keep moving: stop pushing a cart and it stops. But the push was really fighting friction. Galileo noticed that balls rolling on smoother and smoother ramps kept going further, and guessed that with no friction at all they would never stop. Newton made that his first law.

Isaac Newton answered with a thought experiment. Put a cannon on a mountain so tall it pokes out of the air, and fire sideways. The ball curves down and lands. Fire faster and it lands further away, because the ground curves away beneath it. Fire fast enough and the ground curves away exactly as fast as the ball falls, so it never lands: that's an **orbit**. The Moon *is* falling, all the time. Its sideways speed is what keeps it missing.`,Sim:A7,maths:[{title:"Cancelling things out of an equation",body:"An equation is a balance: do the same thing to both sides and it stays true. In $\\dfrac{GMm}{r^2} = \\dfrac{mv^2}{r}$ both sides are multiplied by the ball's mass $m$, so dividing both sides by $m$ removes it. Multiply both sides by $r$ to get $\\dfrac{GM}{r} = v^2$, then take the square root of both sides: $v = \\sqrt{GM/r}$."},{title:"Numbers like 6.67 \xD7 10\u207B\xB9\xB9",body:"$10^{24}$ is 1 followed by 24 zeros; $10^{-11}$ is 1 divided by $10^{11}$, a decimal point followed by 10 zeros and then a 1. So $5.97 \\times 10^{24}$ kg (Earth's mass) is 597 followed by 22 zeros. To multiply such numbers, multiply the front parts and **add** the powers: $10^{-11} \\times 10^{24} = 10^{13}$."}],deeper:`**Newton's Moon test.** The Moon is about 60 Earth radii away. If gravity weakens as $1/r^2$, its pull out there should be $60^2 = 3600$ times weaker than at the surface: $9.8 / 3600 \\approx 0.0027$ m/s\xB2. The Moon's actual orbit (384 000 km, once every 27.3 days) needs an inward acceleration of $v^2/r \\approx 0.0027$ m/s\xB2. They match. Each second the Moon falls about 1.4 mm towards us while travelling 1 km sideways, so it keeps missing. That was the moment gravity became *universal*: one law for apples and moons.

**Thrown balls trace ellipses, not parabolas.** The parabola you learn for a thrown ball assumes flat ground and gravity pointing straight down everywhere. Zoom out and the true path is part of an ellipse with the planet's centre at one focus: the same curves the cannon draws here.
