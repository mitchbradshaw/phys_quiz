# Type-checks, runs the physics tests and builds the single-file site on every push to main. If GitHub Pages is
# switched on (Settings → Pages → Source: GitHub Actions) it also publishes index.html; until then the deploy is
# skipped rather than failing.
name: Test and deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      pages: ${{ steps.pages.outputs.enabled }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: node scripts/typecheck.mjs
      - run: node scripts/test.mjs
      - run: node scripts/build.mjs
      - id: pages
        name: Is GitHub Pages switched on?
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/${{ github.repository }}/pages" > /dev/null 2>&1; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::GitHub Pages is not switched on yet (Settings > Pages > Source: GitHub Actions), so the deploy is skipped."
          fi
      - name: Stage the site (just the built page)
        if: steps.pages.outputs.enabled == 'true'
        run: mkdir -p site && cp index.html site/index.html
      - uses: actions/upload-pages-artifact@v3
        if: steps.pages.outputs.enabled == 'true'
        with:
          path: site

  deploy:
    needs: build
    if: needs.build.outputs.pages == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
